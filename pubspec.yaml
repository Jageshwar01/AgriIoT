name: agriot
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.7.0

dependencies:
  flutter:
    sdk: flutter
  

  cupertino_icons: ^1.0.8
  audioplayers: ^6.0.0
  syncfusion_flutter_charts: ^31.2.16


  # Firebase (mutually compatible versions)
  firebase_core: ^4.2.1
  firebase_auth: ^6.1.2
  cloud_firestore: ^6.1.0
  firebase_database: ^12.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_launcher_icons: ^0.13.1

  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/sounds/alert.mp3

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icons/app_icon.png"